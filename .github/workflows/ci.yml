name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Workspace Setup
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          .\setup.ps1 -ForceSparkReplace

      - name: Verify PySpark
        shell: cmd
        run: |
          test-pyspark.cmd

      - name: Verify Markdown Links
        shell: cmd
        run: |
          .venv\Scripts\python.exe scripts\verify_md_links.py
