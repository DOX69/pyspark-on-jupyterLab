name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  detect_ci_changes:
    name: Detect CI-relevant changes
    runs-on: ubuntu-latest
    outputs:
      run_windows_ci: ${{ steps.changed_files.outputs.run_windows_ci }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed_files
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          changed_files="$(git diff --name-only "$base" "$head")"
          if [ -z "$changed_files" ] || echo "$changed_files" | grep -qv '^apache-spark/'; then
            echo "run_windows_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_windows_ci=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: Build & Test on Windows
    runs-on: windows-latest
    needs: detect_ci_changes
    if: needs.detect_ci_changes.outputs.run_windows_ci == 'true'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Workspace Setup
        shell: powershell
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          .\setup.ps1 -ForceSparkReplace

      - name: Verify Virtual Environment
        shell: powershell
        run: |
          if (-not (Test-Path -LiteralPath ".\.venv\Scripts\python.exe")) {
            throw "Missing virtual environment Python after setup."
          }
          .\.venv\Scripts\python.exe --version
          .\.venv\Scripts\python.exe -m pip --version

      - name: Verify PySpark
        shell: cmd
        run: |
          test-pyspark.cmd

      - name: Verify Markdown Links
        shell: cmd
        run: |
          .venv\Scripts\python.exe scripts\verify_md_links.py
